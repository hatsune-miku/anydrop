[package]
name = "anydrop-desktop-tauri"
version = "0.1.2"
description = "AnyDrop Tauri desktop app"
authors = ["AnyDrop"]
edition = "2021"

[lib]
name = "anydrop_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anydrop = { path = "../../../core" }
arboard = "3.6.1"
# Normalize the formats used by native apps and HTML clipboard fragments.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
base64 = "0.22"
html5ever = "0.38"
url = "2"
dirs = "5.0.1"
open = "5.3.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
toml_edit = "0.20"
tempfile = "3"
tauri = { version = "2.5.1", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-opener = "2.2.6"
tauri-plugin-notification = "2.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2.0"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
plist = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
clipboard-master = "4"

[target.'cfg(windows)'.dependencies]
# Fullscreen-game detection (suppress popups while gaming). Reuses the
# windows-sys version already pulled in by the Tauri stack.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

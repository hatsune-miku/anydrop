[package]
name = "anydrop-desktop-tauri"
version = "0.1.0"
description = "AnyDrop Tauri desktop app"
authors = ["AnyDrop"]
edition = "2021"

[lib]
name = "anydrop_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anydrop = { path = "../../../core" }
arboard = "3.4.1"
# Event-driven clipboard change notifications. arboard only does get/set —
# we need this to detect when the user re-copies the same content, which a
# content-diff poll fundamentally can't see.
clipboard-master = "4"
# PNG encode for outgoing clipboard images; decode on incoming.
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0.1"
open = "5.3.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-opener = "2.2.6"
tauri-plugin-notification = "2.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2.0"

[target.'cfg(windows)'.dependencies]
# Fullscreen-game detection (suppress popups while gaming). Reuses the
# windows-sys version already pulled in by the Tauri stack.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    def hermesExecutable = System.getProperty("os.name").toLowerCase().contains("windows") ? "hermesc.exe" : "hermesc"
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/${hermesExecutable}").absolutePath
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.anydrop.mobile"

    defaultConfig {
        applicationId "com.anydrop.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Distribution signing must be supplied separately; never use the public debug key.
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        dev {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

androidComponents {
    beforeVariants(selector().withBuildType("dev")) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }
}

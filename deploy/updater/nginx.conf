server {
    listen 80;
    listen [::]:80;
    server_name anydrop-api.vanillacake.cn;
    root /var/www/html/anydrop-api;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anydrop-api.vanillacake.cn;
    root /var/www/html/anydrop-api;
    ssl_certificate /etc/letsencrypt/live/anydrop-api.vanillacake.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anydrop-api.vanillacake.cn/privkey.pem;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /rc/latest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri @no_update;
    }
    location @no_update {
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location ~ /\. {
        return 404;
    }
    location /rc/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        autoindex off;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}

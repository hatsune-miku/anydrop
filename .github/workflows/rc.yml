name: Release Candidate

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    # Manual dispatch lets you override the default universal macOS build with
    # an arch-specific one. Push builds always produce a universal binary.
    inputs:
      macos_target:
        description: 'macOS target arch'
        required: false
        default: universal
        type: choice
        options:
          - universal
          - aarch64
          - x86_64

permissions:
  contents: write

jobs:
  validate-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/updater.test.mjs
      - run: python3 -m unittest discover -s tests -p updater_mirror_test.py

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    needs: validate-updater
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      updater: ${{ steps.updater.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: meta
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const app = require("./apps/desktop-tauri/src-tauri/tauri.conf.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${app.version}-rc.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}\n`)'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Yarn cache dir
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare updater configuration
        id: updater
        env:
          ANYDROP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          ANYDROP_UPDATER_PUBLIC_KEY: ${{ vars.ANYDROP_UPDATER_PUBLIC_KEY }}
          ANYDROP_UPDATER_ENDPOINT: ${{ vars.ANYDROP_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY }}
        run: node scripts/prepare-updater.mjs

      - name: Build Windows file context menus
        env:
          ANYDROP_WINDOWS_CERTIFICATE: ${{ secrets.ANYDROP_WINDOWS_CERTIFICATE }}
          ANYDROP_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.ANYDROP_WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/build-windows-shell.ps1 -Version "1.0.${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Build core (anydrop.dll)
        run: cargo build -p anydrop --release

      - name: Build Tauri Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: yarn workspace @anydrop/desktop-tauri tauri build --config src-tauri/.generated/updater.json --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: anydrop-dll
          path: target/release/anydrop.dll

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    needs: validate-updater
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: meta
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const app = require("./apps/desktop-tauri/src-tauri/tauri.conf.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${app.version}-rc.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}\n`)'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Yarn cache dir
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare updater configuration
        id: updater
        env:
          ANYDROP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          ANYDROP_UPDATER_PUBLIC_KEY: ${{ vars.ANYDROP_UPDATER_PUBLIC_KEY }}
          ANYDROP_UPDATER_ENDPOINT: ${{ vars.ANYDROP_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY }}
        run: node scripts/prepare-updater.mjs

      # Resolve the chosen architecture. Push events have no input → fall back
      # to "universal".  `target` is the full rustc/Tauri triple; `slug` is the
      # short tag we use to namespace artifacts.
      - name: Resolve macOS target
        id: target
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.macos_target }}"
          case "${INPUT:-universal}" in
            aarch64)
              echo "triple=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "slug=aarch64"                >> "$GITHUB_OUTPUT"
              ;;
            x86_64)
              echo "triple=x86_64-apple-darwin"  >> "$GITHUB_OUTPUT"
              echo "slug=x86_64"                 >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "triple=universal-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "slug=universal"                >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # For universal, build the standalone dylib twice and lipo-merge. For
      # an arch-specific build, one cargo invocation does the job.
      - name: Build core (libanydrop.dylib)
        shell: bash
        run: |
          TRIPLE="${{ steps.target.outputs.triple }}"
          if [ "$TRIPLE" = "universal-apple-darwin" ]; then
            cargo build -p anydrop --release --target aarch64-apple-darwin
            cargo build -p anydrop --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/libanydrop.dylib \
              target/aarch64-apple-darwin/release/libanydrop.dylib \
              target/x86_64-apple-darwin/release/libanydrop.dylib
          else
            cargo build -p anydrop --release --target "$TRIPLE"
          fi

      - name: Build Tauri macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ANYDROP_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: yarn workspace @anydrop/desktop-tauri tauri build --config src-tauri/.generated/updater.json --target ${{ steps.target.outputs.triple }} --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: libanydrop-dylib-${{ steps.target.outputs.slug }}
          path: target/${{ steps.target.outputs.triple }}/release/libanydrop.dylib

      - name: Zip .app bundle
        run: |
          cd target/${{ steps.target.outputs.triple }}/release/bundle/macos
          zip -r AnyDrop-${{ steps.target.outputs.slug }}.app.zip AnyDrop.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ steps.target.outputs.slug }}
          path: |
            target/${{ steps.target.outputs.triple }}/release/bundle/macos/AnyDrop-${{ steps.target.outputs.slug }}.app.zip
            target/${{ steps.target.outputs.triple }}/release/bundle/dmg/*.dmg
            target/${{ steps.target.outputs.triple }}/release/bundle/macos/*.app.tar.gz
            target/${{ steps.target.outputs.triple }}/release/bundle/macos/*.app.tar.gz.sig

  # ── Release candidate ──────────────────────────────────────────────────────
  # Only push events (which always produce a universal macOS build) and manual
  # dispatches that explicitly chose `universal` create a public RC.  Manual
  # arch-specific builds remain as workflow artifacts only — no release.
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.macos_target == 'universal' ||
        github.event.inputs.macos_target == ''))

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate signed updater manifest
        if: needs.build-windows.outputs.updater == 'true'
        env:
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/rc-v${{ needs.build-windows.outputs.version }}/
        run: node scripts/updater-manifest.mjs artifacts "$RELEASE_VERSION" "$RELEASE_BASE" latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rc-v${{ needs.build-windows.outputs.version }}
          name: 'RC v${{ needs.build-windows.outputs.version }} #${{ github.run_number }}'
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/anydrop-dll/anydrop.dll
            artifacts/libanydrop-dylib-universal/libanydrop.dylib
            latest.json
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.exe.sig
            artifacts/macos-app-universal/**/*.app.tar.gz
            artifacts/macos-app-universal/**/*.app.tar.gz.sig
            artifacts/macos-app-universal/**/AnyDrop-universal.app.zip
            artifacts/macos-app-universal/**/*.dmg

syntax = "proto2";

package anydrop;

message DiscoveryPacket {
  required uint32 address = 1;
  required uint32 server_port = 2;
  required uint32 group_identifier = 3;
  required bool need_response = 4;
  required string host_name = 5;
  // Stable per-install device identity. Optional for backward compatibility
  // with peers that predate this field. Used to group a device's multiple
  // addresses / hostnames as one peer, and as the local-remark key.
  optional string device_id = 6;
}
